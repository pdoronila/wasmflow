[package]
name = "shadow-spot"
version = "1.0.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.30"
glam = "0.25"

[profile.release]
opt-level = "s"
lto = true
strip = true

[package.metadata.component]
package = "wasmflow:shadow-spot"

[package.metadata.component.target]
path = "wit"

[package.metadata.component.target.dependencies]
"wasmflow:node" = { path = "../../../wit" }
